<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="stylesheet" id="theme-link" type="text/css" href="theme-light.css">
  <script src="script.js" async></script>
</head>
<body>
  <main>
    <div id="theme-switch-container">
      <span>L</span>
      <label class="switch">
        <input id="theme-switch" type="checkbox">
        <span class="switch-slider"></span>
      </label>
      <span>D</span>
    </div>
    <h1 id="title">SNAKE</h1>
    <div id="canvas-container">
      <canvas id="canvas" width="320" height="320"></canvas>
    </div>
    <h2 id="score-h2">SCORE: <span id="score"></span></h2>
    <form id="opts">
      <table>
        <tr>
          <th><label>Dots in X</label></th>
          <td><input type="range" value="10" min="5" max="320" class="slider" name="dots-x-slider" id="dots-x-slider"></td>
          <td><input type="number" value="10" min="5" max="320" name="dots-x-number" id="dots-x-number"></td>
        </tr>
        <tr>
          <th><label for="">Canvas Width</label></th>
          <td><input type="range" value="320" min="320" max="1024" class="slider" name="canvas-width-slider" id="canvas-width-slider"></td>
          <td><input type="number" value="320" min="320" max="1024" name="canvas-width-number" id="canvas-width-number"></td>
        </tr>
        <tr>
          <th><label for="">Canvas Height</label></th>
          <td><input type="range" value="320" min="320" max="1024" class="slider" name="canvas-height-slider" id="canvas-height-slider"></td>
          <td><input type="number" value="320" min="320" max="1024" name="canvas-height-number" id="canvas-height-number"></td>
        </tr>
      </table>
    </form>
  </main>
</body>
</html>
